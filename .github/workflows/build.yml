name: Build Xiaobaitiao

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 仓库里的 Gradle 发行版地址指向腾讯镜像（国内本地构建快），
      # 但 GitHub 的托管 runner 在境外，拉这个镜像很慢，所以在 CI 上换成官方地址。
      - name: Use official Gradle distribution on CI
        run: |
          sed -i \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      # 是否配置了签名密钥。没有配置也照常构建，只是产出未签名的 APK。
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置签名密钥（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），本次只产出未签名 APK。"
          fi

      - name: Restore keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        run: |
          set +e
          ./gradlew assembleRelease --console=plain --stacktrace > build-ci.log 2>&1
          code=$?
          tail -n 120 build-ci.log
          if [ "$code" -ne 0 ]; then
            # 把失败原因压缩成一条 annotation，方便在 Actions 页面和 API 里直接看到
            msg="$(tail -n 40 build-ci.log | tr -d '\r' | sed -e 's/%/%25/g' -e 's/\n/%0A/g' | tr '\n' '|' | sed -e 's/|/%0A/g')"
            echo "::error title=Gradle build failed::${msg}"
            exit "$code"
          fi

      - name: Sign APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          mkdir -p dist
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          OUT="dist/Xiaobaitiao-${GITHUB_REF_NAME//\//_}.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" \
            app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"

      - name: Collect unsigned APK
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -eu
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/Xiaobaitiao-${GITHUB_REF_NAME//\//_}-unsigned.apk"
          echo "SIGNED_APK=dist/Xiaobaitiao-${GITHUB_REF_NAME//\//_}-unsigned.apk" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaobaitiao
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
